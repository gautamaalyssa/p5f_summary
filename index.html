<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Haunted Maths Manor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: a moonlit manor seen floor by floor — each school term is a floor, each chapter a room door; play happens on a lantern-lit card with a chunky iPad keypad. Single committed night look. */
:root{
  color-scheme:dark;
  --night:#17122b; --night-2:#211a3d; --panel:#2b2250; --panel-hi:#382c66; --line:#4a3d80;
  --ghost:#f3eefc; --mist:#b7aedb; --pumpkin:#ff8a1f; --moon:#ffe08a; --slime:#8be36b; --rose:#ff6b81;
  --display:"Creepster","Chiller",fantasy;
  --ui:"Fredoka","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night);color:var(--ghost);font-family:var(--ui);font-size:18px;line-height:1.45;
  background-image:radial-gradient(circle at 85% 6%,rgba(255,224,138,.22) 0 60px,transparent 61px),
    radial-gradient(circle at 85% 6%,rgba(255,224,138,.08) 0 160px,transparent 161px),
    linear-gradient(180deg,var(--night) 0%,var(--night-2) 100%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
.title{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,8vw,4.4rem);line-height:.95;color:var(--pumpkin);letter-spacing:.02em;text-shadow:0 3px 0 #000}
.lede{color:var(--mist);margin:0;max-width:60ch}
button{font:inherit;cursor:pointer;border:0;border-radius:16px;color:var(--ghost);background:var(--panel-hi);padding:12px 18px;font-weight:600;touch-action:manipulation}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--pumpkin);color:#2a1300;box-shadow:0 4px 0 #a64f00}
.btn-ghost{background:transparent;border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;font-size:1.3rem;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--night);color:var(--ghost);width:100%;max-width:340px}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar .brand{font-family:var(--display);color:var(--pumpkin);font-size:1.9rem;line-height:1}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--moon)}

/* floors */
.floor{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.floor::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:repeating-linear-gradient(90deg,var(--pumpkin) 0 18px,transparent 18px 30px);opacity:.6}
.floor-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.floor-head h2{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,4.5vw,2.3rem);color:var(--moon);letter-spacing:.03em}
.term{font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mist);font-weight:600}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.door{background:var(--night-2);border:2px solid var(--line);border-radius:18px 18px 10px 10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;font-weight:500}
.door:hover{border-color:var(--pumpkin)}
.door .ch{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mist);font-weight:600}
.door .nm{font-size:1.1rem;font-weight:700;line-height:1.2}
.door .sp{font-size:.88rem;color:var(--mist);font-style:italic}
.door .res{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums}
.stars{letter-spacing:2px;color:var(--moon)}
.stars .off{color:var(--line)}
.door.done{border-color:var(--slime)}
.door.boss{grid-column:1/-1;min-height:auto;background:linear-gradient(90deg,#3b1f4e,#2b2250);border-style:dashed;border-color:var(--pumpkin)}
.door.boss.locked{border-color:var(--line);opacity:.7}
.door.boss.beaten{border-style:solid;border-color:var(--moon)}

/* play */
.play{background:var(--panel);border:2px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px}
.play-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.prog{display:flex;gap:6px}
.prog i{width:28px;height:8px;border-radius:99px;background:var(--line)}
.prog i.ok{background:var(--slime)}.prog i.bad{background:var(--rose)}.prog i.now{background:var(--moon)}
.track{position:relative;height:46px;border-radius:999px;background:var(--night);border:2px solid var(--line);overflow:hidden}
.track .you{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:1.6rem}
.track .boo{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:1.9rem;transition:left .5s cubic-bezier(.3,1.5,.5,1)}
.track-label{font-size:.9rem;color:var(--mist);margin-top:4px}
.qtext{font-size:clamp(1.35rem,3.4vw,1.9rem);font-weight:600;line-height:1.3;margin:0}
.qtext .data{display:block;margin-top:10px;font-size:.8em;font-weight:500;color:var(--mist);white-space:pre-line}
.answer-box{display:flex;align-items:center;gap:10px;background:var(--night);border:3px solid var(--line);border-radius:16px;padding:10px 16px;min-height:66px;font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.answer-box .val{flex:1;min-width:0;overflow-wrap:anywhere}
.answer-box .val:empty::before{content:"Type your answer";color:var(--line);font-size:1.2rem;font-weight:500}
.answer-box .unit{color:var(--mist);font-size:1.2rem}
.answer-box.shake{animation:shake .4s;border-color:var(--rose)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pad button{min-height:64px;font-size:1.6rem;font-weight:700;background:var(--panel-hi);border-radius:14px;box-shadow:0 4px 0 #1a1433}
.pad .fn{font-size:1.05rem;background:var(--line)}
.pad .go{grid-column:span 2;background:var(--slime);color:#123300;box-shadow:0 4px 0 #4f9a35;font-size:1.3rem}
.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mc button{min-height:72px;font-size:1.25rem;background:var(--panel-hi);box-shadow:0 4px 0 #1a1433;overflow-wrap:anywhere}
.mc button.wrong{background:var(--rose);color:#3a0010;box-shadow:none}
.mc button.right{background:var(--slime);color:#123300;box-shadow:none}
.fb{border-radius:16px;padding:14px 16px;font-weight:600;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:rgba(139,227,107,.15);border:2px solid var(--slime)}
.fb.no{background:rgba(255,107,129,.13);border:2px solid var(--rose)}
.fb.hint{background:rgba(255,224,138,.12);border:2px dashed var(--moon);font-weight:500}
.fb .sol{font-weight:500;white-space:pre-line}

.fig{display:flex;justify-content:center;padding:10px;background:var(--night);border-radius:16px;overflow-x:auto}
.fig svg{max-width:100%;height:auto}
.fig polygon{stroke:var(--night);stroke-width:2;stroke-linejoin:round}
.fig .ct{fill:#ffb56b}.fig .cl{fill:var(--pumpkin)}.fig .cr{fill:#c45f0a}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;font-size:.82em;line-height:1.1;font-variant-numeric:tabular-nums}
.fr .fn{padding:0 .2em .06em;border-bottom:.09em solid currentColor;min-width:1ch;text-align:center}
.fr .fd{padding:.06em .2em 0;min-width:1ch;text-align:center}
.slot{display:inline-block;width:.75em;height:.9em;border:2px dashed var(--mist);border-radius:4px;vertical-align:middle}
.answer-box .val{display:flex;align-items:center;gap:.05em}
.answer-box .fr{font-size:.85em}
.pad button small{display:block;font-size:.72rem;font-weight:600;margin-top:2px}
.pad .fr{font-size:.75em}.pad .kw{font-size:1.1rem;vertical-align:middle}

/* chase corridor */
.corridor{position:relative;height:84px;border-radius:18px;overflow:hidden;border:2px solid var(--line);
  background:linear-gradient(180deg,#241c44 0 62%,#1a1430 62% 100%)}
.corridor::after{content:"";position:absolute;left:0;right:0;bottom:22%;height:3px;background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 30px)}
.corridor .torch{position:absolute;top:8px;font-size:1.1rem;animation:flick 1.2s ease-in-out infinite alternate}
@keyframes flick{to{opacity:.55;transform:scale(.9)}}
.corridor .exit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:2.6rem}
.corridor .runner,.corridor .boo{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:2.4rem;transition:left .7s cubic-bezier(.3,1.4,.5,1);z-index:2}
.corridor .boo{opacity:.9;animation:hover 1.6s ease-in-out infinite;z-index:1}
@keyframes hover{50%{transform:translate(-50%,-62%)}}
/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--night-2);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.item.own{border-color:var(--slime)}
.item-ic{font-size:2.6rem;line-height:1}
.item-nm{font-weight:600;min-height:2.6em;display:flex;align-items:center}
.item button{width:100%;padding:10px 8px;font-size:.95rem}
.haunt{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:2px solid var(--line);
  background:radial-gradient(circle at 50% 30%,#3a2d6b 0,#241c44 60%,#1a1430 100%)}
.haunt-floor{position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#2e2152 0 40px,#271c47 40px 80px)}
.haunt .deco{position:absolute;transform:translate(-50%,-50%);line-height:1;animation:rise .4s ease-out}
.haunt .deco.me{z-index:2}
.haunt-empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);margin:0;color:var(--mist);text-align:center;width:80%}
.frac-box{justify-content:center;gap:14px;padding:12px 16px}
.slot-btn{min-width:72px;min-height:56px;padding:4px 10px;font-size:1.8rem;font-weight:700;background:var(--panel-hi);border:3px dashed var(--line);border-radius:12px;color:var(--ghost);font-variant-numeric:tabular-nums}
.slot-btn small{font-size:.8rem;font-weight:600;color:var(--mist)}
.slot-btn.filled{border-style:solid}
.slot-btn.active{border:3px solid var(--moon);background:#4a3c80;box-shadow:0 0 0 4px rgba(255,224,138,.25)}
.slot-btn.whole{min-height:80px;font-size:2.2rem}
.fr-in{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.fr-bar{width:100%;min-width:80px;height:4px;border-radius:2px;background:var(--ghost)}

/* diagrams */
.geo{max-width:100%;height:auto;overflow:visible}
.geo line,.geo path,.geo polyline,.geo rect,.geo circle{stroke:var(--ghost);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.geo .arc{stroke:var(--moon);stroke-width:3}
.geo .mark{stroke:var(--slime);stroke-width:3}
.geo .par{stroke:var(--pumpkin);stroke-width:4}
.geo .dot{fill:var(--ghost);stroke:none}
.geo .thin{stroke:var(--line);stroke-width:2}
.geo .tick{stroke:var(--moon);stroke-width:3}
.geo .soft{stroke:var(--mist);stroke-width:3;fill:var(--panel-hi)}
.geo .hl{stroke:var(--pumpkin);stroke-width:7}
.geo .shape{stroke:var(--ghost);stroke-width:4;fill:rgba(255,255,255,.03)}
.geo .base{fill:var(--panel-hi);stroke:var(--night);stroke-width:3}
.geo .top{fill:var(--pumpkin);stroke:var(--night);stroke-width:3}
.geo .gone{fill:transparent;stroke:var(--mist);stroke-width:3;stroke-dasharray:8 6}
.geo .bar{fill:var(--pumpkin);stroke:none}
.geo .lineg{stroke:var(--pumpkin);stroke-width:4}
.geo .pt-dot{fill:var(--moon);stroke:none}
.geo text{fill:var(--ghost);stroke:none;font:600 22px var(--ui)}
.geo text.val{fill:var(--moon)}
.geo text.ask{fill:var(--pumpkin);font-weight:700;font-size:28px}
.geo text.pt{font-size:24px;font-weight:700}
.geo text.axis{font-size:17px;font-weight:500;fill:var(--mist)}
.geo text.big{font-size:26px}
.fig-two{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.fig-two .geo{width:min(240px,45%)}
.mc.big-opt button{font-size:2.4rem;font-weight:700;min-height:90px}
.resume{background:var(--panel);border:2px solid var(--moon);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--moon);text-decoration:underline;font-weight:600;font-size:inherit}
.loadcode summary{cursor:pointer;color:var(--moon);font-weight:600}
/* result / overlays */
.sheet{position:fixed;inset:0;background:rgba(8,5,20,.82);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);border:2px solid var(--line);border-radius:24px;width:min(620px,100%);max-height:100%;overflow:auto;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:16px;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.big{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,9vw,4rem);line-height:1;color:var(--pumpkin)}
.big.green{color:var(--slime)}
.bigstars{font-size:2.8rem;letter-spacing:6px;color:var(--moon)}
.bigstars .off{color:var(--line)}
.fact{background:var(--night);border-radius:16px;padding:14px 16px;border-left:6px solid var(--moon)}
.fact b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--moon);margin-bottom:4px}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:grid;grid-template-columns:2.2ch 1fr auto auto;gap:12px;align-items:center;background:var(--night);border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums}
.board li.me{outline:2px solid var(--pumpkin)}
.board .nm{min-width:0;overflow-wrap:anywhere;font-weight:600}
.board .x{background:transparent;padding:2px 8px;font-size:.85rem;color:var(--mist);border:1px solid var(--line);border-radius:8px}
.note{font-size:.92rem;color:var(--mist);margin:0}
.code{font-size:1.8rem;font-weight:700;letter-spacing:.08em;color:var(--moon);background:var(--night);border-radius:12px;padding:8px 14px;user-select:all;text-align:center}
.teacher{border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.msg{min-height:1.4em;font-weight:600}
.msg.err{color:var(--rose)}.msg.ok{color:var(--slime)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{background:var(--moon);color:#3a2a00;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700}
.bats{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.bats span{position:absolute;font-size:2rem;animation:fly 1.6s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--r));opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.mc{grid-template-columns:1fr}.pad button{min-height:56px}}
</style>

<div class="wrap" id="app"></div>
<div class="sheet" id="sheet" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div class="bats" id="bats" aria-hidden="true"></div>

<script>
/* ===== Question bank: Singapore P5 Maths, 4 terms, 16 chapters, 5 questions each (easy → hard) =====
   t: num | frac | mc   d: 1 easy, 2 medium, 3 hard   form: improper | mixed (frac only)   simp: answer must be in simplest form */
const FLOORS=[
{name:"The Front Hall",term:"Term 1",rooms:[
 {ch:1,title:"Number to 10 Million",sp:"The Cobweb Counting Room",
  fact:"A million seconds is about 11½ days. A billion seconds is nearly 32 years!",
  qs:[
  {d:1,t:"num",q:"What is the value of the digit 5 in 3 500 000?",a:500000,h:"Name the places from the right: ones, tens, hundreds, thousands, ten thousands, hundred thousands.",s:"The 5 is in the hundred thousands place, so its value is 500 000."},
  {d:1,t:"num",q:"Write in numerals: four million.",a:4000000,h:"One million is 1 000 000.",s:"Four million = 4 000 000"},
  {d:2,t:"num",q:"Write in numerals: two million, three hundred thousand.",a:2300000,h:"Start with 2 000 000, then add 300 000.",s:"2 000 000 + 300 000 = 2 300 000"},
  {d:2,t:"num",q:"Round 4 700 000 to the nearest million.",a:5000000,h:"Is 4 700 000 closer to 4 million or 5 million?",s:"The hundred thousands digit is 7, so round up: 5 000 000."},
  {d:3,t:"num",q:"What number is 1000 more than 6 250 000?",a:6251000,h:"Add 1 to the thousands digit.",s:"6 250 000 + 1000 = 6 251 000"}]},
 {ch:2,title:"Four Operations of Whole Numbers",sp:"The Bubbling Cauldron",
  fact:"Multiply any 3-digit number by 1001 and the answer repeats it: 123 × 1001 = 123 123. Spooky!",
  qs:[
  {d:1,t:"num",q:"2500 + 1300 = ?",a:3800,h:"Add the thousands, then the hundreds.",s:"2500 + 1300 = 3800"},
  {d:1,t:"num",q:"900 − 350 = ?",a:550,h:"Take away 300 first, then 50.",s:"900 − 300 = 600\n600 − 50 = 550"},
  {d:2,t:"num",q:"24 × 5 = ?",a:120,h:"Work out 20 × 5 and 4 × 5, then add.",s:"20 × 5 = 100\n4 × 5 = 20\n100 + 20 = 120"},
  {d:2,t:"num",q:"10 + 6 × 2 = ?",a:22,h:"Multiply before you add.",s:"6 × 2 = 12\n10 + 12 = 22"},
  {d:3,t:"num",q:"A witch shares 96 sweets equally among 8 children. How many sweets does each child get?",a:12,h:"Divide 96 by 8.",s:"96 ÷ 8 = 12"}]},
 {ch:3,title:"Factors and Multiples",sp:"The Fang Library",
  fact:"13 is a prime number. A fear of the number 13 has a name: triskaidekaphobia!",
  qs:[
  {d:1,t:"mc",q:"Which number is a factor of 12?",o:["4","5","7","9"],a:"4",h:"A factor divides 12 exactly, with no remainder.",s:"12 ÷ 4 = 3, so 4 is a factor of 12."},
  {d:1,t:"num",q:"What is the 3rd multiple of 5?",a:15,h:"Count in 5s: 5, 10, …",s:"5, 10, 15. The 3rd multiple is 15."},
  {d:2,t:"mc",q:"Which number is a common factor of 8 and 12?",o:["4","3","6","8"],a:"4",h:"It must divide BOTH 8 and 12 exactly.",s:"8 ÷ 4 = 2 and 12 ÷ 4 = 3, so 4 is a common factor."},
  {d:2,t:"num",q:"What is the lowest common multiple of 2 and 3?",a:6,h:"List the multiples of 3: 3, 6, … Which one is also a multiple of 2?",s:"Multiples of 3: 3, 6\n6 is also a multiple of 2. LCM = 6"},
  {d:3,t:"mc",q:"Which number is a multiple of both 4 and 6?",o:["12","10","16","18"],a:"12",h:"Count in 4s and in 6s. Which number shows up in both lists?",s:"4, 8, 12…\n6, 12…\n12 is in both lists."}]},
 {ch:4,title:"Fraction as Part of a Whole",sp:"The Pumpkin Pie Pantry",
  fact:"The word “fraction” comes from the Latin word fractus, which means broken.",
  qs:[
  {d:1,t:"frac",q:"A pie is cut into 4 equal slices. A ghost eats 1 slice. What fraction of the pie did the ghost eat?",a:"1/4",h:"1 slice out of 4 slices.",s:"1 out of 4 = 1/4"},
  {d:1,t:"num",q:"Find 1/2 of 20.",a:10,h:"Half means divide by 2.",s:"20 ÷ 2 = 10"},
  {d:2,t:"num",q:"Find 1/4 of 12.",a:3,h:"Divide 12 into 4 equal parts.",s:"12 ÷ 4 = 3"},
  {d:2,t:"frac",q:"A ghost ate 2/5 of a pie. What fraction of the pie is left?",a:"3/5",h:"The whole pie is 5/5.",s:"5/5 − 2/5 = 3/5"},
  {d:3,t:"num",q:"There are 12 pumpkins. 3/4 of them are orange. How many pumpkins are orange?",a:9,h:"Find 1/4 of 12 first.",s:"1/4 of 12 = 3\n3/4 of 12 = 3 × 3 = 9"}]}
]},
{name:"The Ghostly Gallery",term:"Term 2",rooms:[
 {ch:5,title:"Time",sp:"The Grandfather Clock Room",
  fact:"Earth spins once in about 23 hours 56 minutes compared with the stars, a little less than 24 hours.",
  qs:[
  {d:1,t:"num",u:"min",q:"How many minutes are there in 1 hour?",a:60,h:"Think of the minute hand going all the way round.",s:"1 hour = 60 minutes"},
  {d:1,t:"mc",q:"Which 24-hour clock time is the same as 3.00 p.m.?",o:["15 00","03 00","13 00","12 00"],a:"15 00",h:"For p.m. times, add 12 to the hour.",s:"3 + 12 = 15, so 3.00 p.m. is 15 00."},
  {d:2,t:"num",u:"min",q:"How many minutes are there in 1 h 30 min?",a:90,h:"1 hour is 60 minutes.",s:"60 + 30 = 90 min"},
  {d:2,t:"num",u:"min",q:"A puppet show starts at 4.00 p.m. and ends at 4.45 p.m. How long is the show?",a:45,h:"Count the minutes from 4.00 to 4.45.",s:"4.00 → 4.45 = 45 min"},
  {d:3,t:"mc",q:"A spooky movie starts at 7.30 p.m. It lasts 1 h 15 min. When does it end?",o:["8.45 p.m.","8.15 p.m.","8.30 p.m.","9.15 p.m."],a:"8.45 p.m.",h:"Add 1 hour first, then add 15 minutes.",s:"7.30 + 1 h = 8.30\n8.30 + 15 min = 8.45 p.m."}]},
 {ch:6,title:"Angles",sp:"The Bat Wing Chamber",
  fact:"The ancient Babylonians counted in 60s, which is probably why a full turn has 360 degrees.",
  qs:[
  {d:1,t:"num",u:"°",q:"How many degrees are there in a right angle?",a:90,h:"Think of the corner of a square.",s:"A right angle is 90°."},
  {d:1,t:"mc",q:"An angle smaller than a right angle is called…",o:["an acute angle","an obtuse angle","a straight angle","a full turn"],a:"an acute angle",h:"Acute angles are small and sharp, like a witch's hat.",s:"An angle less than 90° is acute."},
  {d:2,t:"num",u:"°",q:"Angles on a straight line add up to how many degrees?",a:180,h:"A straight line is half a full turn.",s:"Angles on a straight line add up to 180°."},
  {d:2,t:"num",u:"°",q:"Two angles are on a straight line. One of them is 100°. What is the other angle?",a:80,h:"Angles on a straight line add up to 180°.",s:"180° − 100° = 80°"},
  {d:3,t:"num",u:"°",q:"How many degrees are there in a full turn?",a:360,h:"A full turn is 4 right angles.",s:"4 × 90° = 360°"}]},
 {ch:7,title:"Perpendicular and Parallel Lines",sp:"The Railway of Lost Souls",
  fact:"Railway tracks are parallel, yet they seem to meet far away. That trick of the eye is called perspective.",
  qs:[
  {d:1,t:"mc",q:"Two lines meet at a right angle. They are…",o:["perpendicular","parallel","neither"],a:"perpendicular",h:"Look for the small square in the corner. It shows a right angle.",s:"Lines that meet at a right angle are perpendicular. We write AB ⊥ CD."},
  {d:1,t:"mc",q:"The two rails of an MRT track are…",o:["parallel","perpendicular","neither"],a:"parallel",h:"Do the two rails ever meet?",s:"The rails never meet, so they are parallel."},
  {d:2,t:"mc",q:"The side of a door and the floor are…",o:["perpendicular","parallel","neither"],a:"perpendicular",h:"The door stands straight up from the floor. What angle do they make?",s:"The door edge meets the floor at a right angle, so they are perpendicular."},
  {d:2,t:"mc",q:"Which symbol means “is parallel to”?",o:["//","⊥","=","+"],a:"//",h:"Parallel lines are marked with arrowheads. The symbol looks like two lines side by side.",s:"// means “is parallel to”. ⊥ means “is perpendicular to”."},
  {d:3,t:"mc",q:"Which capital letter has perpendicular lines?",o:["T","V","N","O"],a:"T",h:"Look for two lines that meet at a right angle, like the corner of a square.",s:"In T, the two lines meet at a right angle. L and H have perpendicular lines too."}]},
 {ch:8,title:"Rectangles and Squares",sp:"The Portrait Gallery",
  fact:"Every square is a rectangle, but not every rectangle is a square!",
  qs:[
  {d:1,t:"num",q:"How many right angles does a square have?",a:4,h:"Count the corners. Every corner of a square is 90°.",s:"A square has 4 corners and each one is a right angle: 4 right angles."},
  {d:1,t:"mc",q:"What is the only difference between a square and a rectangle?",o:["A square has all sides the same length","A square has no right angles","A rectangle has 3 corners","A rectangle has no parallel sides"],a:"A square has all sides the same length",h:"Both shapes have 4 right angles and opposite sides parallel. What about the sides?",s:"Square: ALL sides the same.\nRectangle: OPPOSITE sides the same.\nBoth have 4 right angles."},
  {d:2,t:"mc",q:"ABCD is a square. Which pair of sides is parallel?",o:["AB // DC","AB // BC","DA // AB","BC // CD"],a:"AB // DC",h:"Parallel sides are opposite each other. Sides that meet at a corner are perpendicular.",s:"AB and DC are opposite sides, so AB // DC.\nThe other pairs meet at a corner, so they are perpendicular."},
  {d:2,t:"num",u:"°",q:"ABCD is a square. A line is drawn from corner D to side BC. It makes a 35° angle with side DC. What is the unknown angle between DA and the line?",a:55,h:"ABCD is a square, so every corner is 90°.",s:"Every corner is 90°.\n90° − 35° = 55°"},
  {d:3,t:"num",u:"°",q:"PQRS is a rectangle standing up tall. A line is drawn from corner S to side QR. It makes a 25° angle with side SR. What is the unknown angle between SP and the line?",a:65,h:"A rectangle standing up tall is still a rectangle. Every corner is 90°.",s:"Every corner is 90°.\n90° − 25° = 65°"}]},
 {ch:9,title:"Mixed Numbers and Improper Fractions",sp:"The Candy Cupboard",
  fact:"If a pumpkin pie has 8 slices and you eat 10 slices, you have eaten 1 2/8 = 1 1/4 pies!",
  qs:[
  {d:1,t:"frac",form:"improper",q:"Write 1 1/2 as an improper fraction.",a:"3/2",h:"1 whole = 2 halves. Add the 1 half.",s:"1 × 2 + 1 = 3, so 1 1/2 = 3/2"},
  {d:1,t:"frac",form:"mixed",q:"Write 5/4 as a mixed number. (Use the whole-number box for the 1.)",a:"1 1/4",h:"4 quarters make 1 whole. How many quarters are left?",s:"5/4 = 4/4 + 1/4 = 1 1/4"},
  {d:2,t:"frac",form:"improper",q:"Write 2 1/3 as an improper fraction.",a:"7/3",h:"2 wholes = 6 thirds. Add the 1 third.",s:"2 × 3 + 1 = 7, so 2 1/3 = 7/3"},
  {d:2,t:"frac",q:"1 1/4 + 1 2/4 = ?",a:"2 3/4",h:"Add the wholes, then add the quarters.",s:"Wholes: 1 + 1 = 2\nQuarters: 1/4 + 2/4 = 3/4\nAnswer: 2 3/4"},
  {d:3,t:"frac",form:"mixed",q:"Write 11/3 as a mixed number.",a:"3 2/3",h:"How many 3s go into 11, and what is left over?",s:"11 ÷ 3 = 3 remainder 2, so 11/3 = 3 2/3"}]},
 {ch:10,title:"Multiplication of Fractions",sp:"The Potion Lab",
  fact:"Multiplying by a fraction smaller than 1 makes a number smaller. Half of 10 is 5!",
  qs:[
  {d:1,t:"frac",q:"1/2 × 1/3 = ?",a:"1/6",h:"Multiply the top numbers, then multiply the bottom numbers.",s:"(1 × 1)/(2 × 3) = 1/6"},
  {d:1,t:"num",q:"1/2 × 10 = ?",a:5,h:"Half of 10.",s:"10 ÷ 2 = 5"},
  {d:2,t:"frac",q:"2/3 × 1/2 = ?",a:"1/3",h:"Multiply top × top and bottom × bottom, then simplify.",s:"(2 × 1)/(3 × 2) = 2/6 = 1/3"},
  {d:2,t:"num",q:"1/4 × 20 = ?",a:5,h:"1/4 of 20 means 20 ÷ 4.",s:"20 ÷ 4 = 5"},
  {d:3,t:"num",u:"L",q:"A witch has 12 L of potion. She uses 1/3 of it. How many litres does she use?",a:4,h:"Find 1/3 of 12.",s:"12 ÷ 3 = 4 L"}]}
]},
{name:"The Witch's Kitchen",term:"Term 3",rooms:[
 {ch:11,title:"Decimals",sp:"The Spice Rack",
  fact:"0.999… with 9s going on forever is exactly equal to 1. Mathematicians can prove it!",
  qs:[
  {d:1,t:"num",q:"Write 1/10 as a decimal.",a:0.1,h:"One tenth goes in the first place after the decimal point.",s:"1/10 = 0.1"},
  {d:1,t:"num",q:"What is the value of the digit 3 in 2.35?",a:0.3,h:"The first place after the point is tenths.",s:"3 is in the tenths place: 0.3"},
  {d:2,t:"num",q:"Write 1/2 as a decimal.",a:0.5,h:"1/2 = 5/10",s:"1/2 = 5/10 = 0.5"},
  {d:2,t:"mc",q:"Which number is the largest?",o:["0.5","0.25","0.05","0.45"],a:"0.5",h:"Compare the tenths digit first.",s:"0.5 has the most tenths, so it is the largest."},
  {d:3,t:"num",q:"Round 3.46 to 1 decimal place.",a:3.5,h:"Look at the hundredths digit. Is it 5 or more?",s:"The hundredths digit is 6, so round up: 3.5"}]},
 {ch:12,title:"Four Operations of Decimals",sp:"The Bubbling Scales",
  fact:"John Napier helped make the decimal point popular about 400 years ago.",
  qs:[
  {d:1,t:"num",q:"1.5 + 2.3 = ?",a:3.8,h:"Add the ones, then add the tenths.",s:"1.5 + 2.3 = 3.8"},
  {d:1,t:"num",q:"5.6 − 1.2 = ?",a:4.4,h:"Subtract the ones, then the tenths.",s:"5.6 − 1.2 = 4.4"},
  {d:2,t:"num",q:"0.4 × 3 = ?",a:1.2,h:"4 tenths × 3 = ? tenths",s:"4 tenths × 3 = 12 tenths = 1.2"},
  {d:2,t:"num",q:"6.3 ÷ 3 = ?",a:2.1,h:"Divide the ones, then divide the tenths.",s:"6 ÷ 3 = 2 and 0.3 ÷ 3 = 0.1, so 2.1"},
  {d:3,t:"num",u:"$",q:"A mask costs $3.50. Lisa pays with a $5 note. How much change does she get?",a:1.5,h:"Work out $5 − $3.50.",s:"$5.00 − $3.50 = $1.50"}]},
 {ch:13,title:"Rate",sp:"The Broomstick Garage",
  fact:"A cheetah can sprint at about 100 km per hour, but only for around 20 to 30 seconds.",
  qs:[
  {d:1,t:"num",q:"A printer prints 10 spooky posters every minute. How many posters does it print in 3 minutes?",a:30,h:"Multiply the posters per minute by the minutes.",s:"10 × 3 = 30 posters"},
  {d:1,t:"num",u:"L",q:"A tap fills 20 L of water in 4 minutes. How many litres does it fill in 1 minute?",a:5,h:"Divide the litres by the minutes.",s:"20 ÷ 4 = 5 L"},
  {d:2,t:"num",q:"A bat flaps its wings 12 times every second. How many times does it flap in 5 seconds?",a:60,h:"Multiply the flaps per second by the seconds.",s:"12 × 5 = 60 flaps"},
  {d:2,t:"num",u:"$",q:"Candy costs $2 per bag. How much do 6 bags cost?",a:12,h:"Multiply the price of 1 bag by 6.",s:"6 × $2 = $12"},
  {d:3,t:"num",u:"min",q:"A machine makes 8 masks every minute. How many minutes does it take to make 40 masks?",a:5,h:"How many 8s make 40?",s:"40 ÷ 8 = 5 min"}]}
]},
{name:"The Attic of Shadows",term:"Term 4",rooms:[
 {ch:14,title:"Area and Perimeter",sp:"The Pumpkin Patch",
  fact:"The heaviest pumpkin ever grown weighed more than 1200 kg, about as heavy as a small car!",
  qs:[
  {d:1,t:"num",u:"cm²",q:"Find the area of a rectangle that is 5 cm long and 4 cm wide.",a:20,h:"Area = length × width",s:"5 × 4 = 20 cm²"},
  {d:1,t:"num",u:"cm",q:"Find the perimeter of a square with sides of 6 cm.",a:24,h:"A square has 4 equal sides. Add them all.",s:"4 × 6 = 24 cm"},
  {d:2,t:"num",u:"cm",q:"Find the perimeter of a rectangle that is 8 cm long and 3 cm wide.",a:22,h:"Add all 4 sides: 8 + 3 + 8 + 3.",s:"8 + 3 + 8 + 3 = 22 cm"},
  {d:2,t:"num",u:"cm²",q:"Find the area of a square with sides of 3 cm.",a:9,h:"Area of a square = side × side",s:"3 × 3 = 9 cm²"},
  {d:3,t:"num",u:"cm",q:"A square has an area of 25 cm². How long is one side?",a:5,h:"Which number times itself makes 25?",s:"5 × 5 = 25, so each side is 5 cm."}]},
 {ch:15,title:"Volume",sp:"The Slime Tank Room",
  fact:"An Olympic swimming pool holds about 2.5 million litres of water. That is a lot of slime!",
  qs:[
  {d:1,t:"num",u:"cm³",fig:[[1,1,1,1]],q:"This solid is made of 1-cm cubes. What is its volume?",a:4,h:"Count the cubes. Each cube is 1 cm³.",s:"There are 4 cubes, so the volume is 4 cm³."},
  {d:1,t:"num",fig:[[1,1,1],[1,1,1]],q:"How many unit cubes make up this solid?",a:6,h:"Count the back row, then the front row.",s:"Back row: 3 cubes\nFront row: 3 cubes\n3 + 3 = 6 cubes"},
  {d:2,t:"num",u:"cm³",fig:[[3,2,1]],q:"This solid is made of 1-cm cubes. What is its volume?",a:6,h:"Count the cubes in each stack, then add.",s:"3 + 2 + 1 = 6 cubes\nThe volume is 6 cm³."},
  {d:2,t:"num",u:"cm³",fig:[[2,2],[2,2]],q:"This solid is made of 1-cm cubes. What is its volume?",a:8,h:"There are 2 layers. Count the cubes in the top layer, then double it.",s:"Top layer: 4 cubes\nBottom layer: 4 cubes\n4 + 4 = 8 cm³"},
  {d:3,t:"num",fig:[[1,1,1],[1,0,0]],q:"How many more unit cubes are needed to make this solid into a cuboid that is 3 cubes long, 2 cubes wide and 1 layer high?",a:2,h:"A cuboid 3 long and 2 wide needs 3 + 3 cubes. How many are there now?",s:"A full cuboid needs 3 × 2 = 6 cubes.\nThere are 4 cubes now.\n6 − 4 = 2 more cubes"}]},
 {ch:16,title:"Tables and Graphs",sp:"The Fortune Teller's Charts",
  fact:"Florence Nightingale drew graphs to show that clean hospitals saved lives, and the army listened.",
  qs:[
  {d:1,t:"num",q:"How many more bags of candy were sold on Tuesday than on Wednesday?",data:"Candy sold\nMonday: 12 bags\nTuesday: 15 bags\nWednesday: 9 bags",a:6,h:"Subtract Wednesday's number from Tuesday's.",s:"15 − 9 = 6"},
  {d:1,t:"mc",q:"On which day were the most bags of candy sold?",data:"Candy sold\nMonday: 12 bags\nTuesday: 15 bags\nWednesday: 9 bags",o:["Tuesday","Monday","Wednesday","They are all the same"],a:"Tuesday",h:"Find the biggest number.",s:"15 is the biggest number, so Tuesday."},
  {d:2,t:"num",q:"How many bags of candy were sold altogether?",data:"Candy sold\nMonday: 12 bags\nTuesday: 15 bags\nWednesday: 9 bags",a:36,h:"Add all three days.",s:"12 + 15 + 9 = 36"},
  {d:2,t:"num",q:"How many more pupils chose mango than banana?",a:5,h:"Read the mango bar and the banana bar, then subtract.",s:"Mango: 10 pupils\nBanana: 5 pupils\n10 − 5 = 5"},
  {d:3,t:"num",u:"°C",q:"By how many degrees did the temperature rise from 9 a.m. to 3 p.m.?",data:"Temperature\n9 a.m.: 26 °C\n12 p.m.: 30 °C\n3 p.m.: 31 °C",a:5,h:"Subtract the 9 a.m. temperature from the 3 p.m. temperature.",s:"31 − 26 = 5 °C"}]}
]}];

/* Background music: a soft, spooky loop in A minor, built from simple tones. It speeds up when the ghost is close. */
const Music=(()=>{
  const n=m=>440*2**((m-69)/12);
  const bass=[45,41,48,40], chords=[[57,60,64],[53,57,60],[55,60,64],[52,56,59]];
  const tune=[76,72,69,72, 77,72,69,72, 79,76,72,76, 76,75,71,68];
  let timer=null,next=0,step=0,master=null;
  function note(f,t,d,type,vol){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
  function tick(){if(!ac||ac.state!=="running")return;
    const close=play&&play.gap!==undefined&&play.gap<=1.5&&!play.locked, beat=close?.24:.36;
    while(next<ac.currentTime+.4){const bar=Math.floor(step/4)%4,b=step%4;
      if(b===0)note(n(bass[bar]),next,beat*4,"sine",.5);
      note(n(chords[bar][b%3]),next,beat*1.6,"triangle",.12);
      if(step%2===0)note(n(tune[(step/2)%16]),next,beat*1.8,"sine",.16);
      next+=beat;step=(step+1)%64}}
  return{start(){if(timer||!getAC())return;if(!master){master=ac.createGain();master.connect(ac.destination)}
      master.gain.cancelScheduledValues(ac.currentTime);master.gain.setValueAtTime(.0001,ac.currentTime);master.gain.exponentialRampToValueAtTime(.12,ac.currentTime+1.2);
      next=ac.currentTime+.1;timer=setInterval(tick,100)},
    stop(){if(!timer)return;clearInterval(timer);timer=null;try{master.gain.setTargetAtTime(.0001,ac.currentTime,.15)}catch(e){}}};
})();
function tone(f,d=.12,type="triangle",delay=0,vol=.07){if(!soundOn)return;try{getAC();

/* draw a solid of unit cubes in isometric view; fig[row][col] = stack height, row 0 at the back */
function cubes(fig){
  const dx=30,dy=17,h=34,parts=[];let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  const list=[];fig.forEach((row,r)=>row.forEach((ht,c)=>{for(let z=0;z<ht;z++)list.push({r,c,z})}));
  list.sort((a,b)=>(a.r+a.c)-(b.r+b.c)||a.z-b.z);
  list.forEach(({r,c,z})=>{const X=(c-r)*dx,Y=(c+r)*dy-z*h;
    const P=pts=>pts.map(p=>p.join(",")).join(" ");
    parts.push(`<polygon class="cl" points="${P([[X-dx,Y+dy],[X,Y+2*dy],[X,Y+2*dy+h],[X-dx,Y+dy+h]])}"/>`,
      `<polygon class="cr" points="${P([[X,Y+2*dy],[X+dx,Y+dy],[X+dx,Y+dy+h],[X,Y+2*dy+h]])}"/>`,
      `<polygon class="ct" points="${P([[X,Y],[X+dx,Y+dy],[X,Y+2*dy],[X-dx,Y+dy]])}"/>`);
    minX=Math.min(minX,X-dx);maxX=Math.max(maxX,X+dx);minY=Math.min(minY,Y);maxY=Math.max(maxY,Y+2*dy+h)});
  const pad=6;
  return `<svg viewBox="${minX-pad} ${minY-pad} ${maxX-minX+2*pad} ${maxY-minY+2*pad}" width="${maxX-minX+2*pad}" role="img" aria-label="A solid made of ${list.length>0?"unit cubes":"cubes"}">${parts.join("")}</svg>`;
}

/* ===== fraction display: show a/b as a stacked fraction ===== */
const frac=(n,d)=>`<span class="fr"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
function fx(t){
  let h=esc(t);
  h=h.replace(/\(([^()]+)\)\/\(([^()]+)\)/g,(m,a,b)=>frac(a,b));
  h=h.replace(/(\d+) (\d+)\/(\d+)/g,(m,w,a,b)=>`${w}${frac(a,b)}`);
  h=h.replace(/(\d+|\?)\/(\d+|\?)/g,(m,a,b)=>frac(a,b));
  return h;
}
function typed(v){
  if(!v) return "";
  const box='<span class="slot"></span>';
  if(v.includes("/")){const [left,den]=v.split("/");const parts=left.split(" ");
    const whole=parts.length>1?parts[0]:"", num=parts.length>1?parts[1]:parts[0];
    return `${whole}${frac(num||box,den||box)}`}
  if(v.endsWith(" ")) return `${v.trim()}${frac('<span class="slot"></span>',box)}`;
  const parts=v.split(" ");
  if(parts.length>1) return `${parts[0]}${frac(parts[1],box)}`;
  return v;
}
/* ===== answer checking ===== */
const gcd=(a,b)=>b?gcd(b,a%b):a;
function parseAns(raw){
  const s=raw.trim().replace(/\s+/g," ");
  let m=s.match(/^(\d+) (\d+)\/(\d+)$/); if(m&&+m[3]>0) return{v:+m[1]+(+m[2]/+m[3]),kind:"mixed",n:+m[2],d:+m[3]};
  m=s.match(/^(\d+)\/(\d+)$/); if(m&&+m[2]>0) return{v:+m[1]/+m[2],kind:"frac",n:+m[1],d:+m[2]};
  const n=s.replace(/[ ,]/g,""); if(/^\d*\.?\d+$|^\d+\.$/.test(n)) return{v:parseFloat(n),kind:"num"};
  return null;
}
function fracVal(a){return parseAns(a).v}
function check(q,raw){
  if(q.t==="mc") return {ok:raw===q.a};
  const p=parseAns(raw); if(!p) return {ok:false,msg:"That doesn't look like a number. Check what you typed."};
  const target=q.t==="frac"?fracVal(q.a):q.a;
  if(Math.abs(p.v-target)>1e-9) return {ok:false};
  if(q.form==="improper"&&p.kind!=="frac") return {ok:false,msg:"Right value, but write it as an improper fraction, like 9/4."};
  if(q.form==="mixed"&&p.kind!=="mixed") return {ok:false,msg:"Right value, but write it as a mixed number, like 2 1/4."};
  if(q.simp&&(p.kind==="num"||gcd(p.n,p.d)!==1)) return {ok:false,msg:"Right value! Now write it as a fraction in its simplest form."};
  return {ok:true};
}

function findRoom(ch){for(const f of FLOORS)for(const r of f.rooms)if(r.ch===ch)return r}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
function pickMix(pool,n=5){const by=d=>shuffle(pool.filter(q=>q.d===d));const want=[[1,2],[2,2],[3,1]];let out=[];
  want.forEach(([d,k])=>out=out.concat(by(d).slice(0,k)));
  if(out.length<n)out=out.concat(shuffle(pool.filter(q=>!out.includes(q))).slice(0,n-out.length));
  return out.slice(0,n).sort((a,b)=>a.d-b.d)}
function startRoom(ch){const r=findRoom(ch);begin({key:String(ch),title:r.title,sub:r.sp,qs:pickMix(r.qs),fact:r.fact,boss:false})}
function startBoss(fi){
  const f=FLOORS[fi], pool=f.rooms.flatMap(r=>r.qs);
  const missed=P.missed.map(id=>ALLQ[id]).filter(q=>q&&q.floor===fi);
  const rest=pool.filter(q=>!missed.includes(q)).sort(()=>Math.random()-.5);
  const qs=missed.sort(()=>Math.random()-.5).slice(0,6).concat(rest).slice(0,6).sort((a,b)=>a.d-b.d);
  begin({key:"boss"+fi,title:`The Ghost Boss of ${f.name}`,sub:"Consolidation",qs,boss:true,
    fact:`You beat the Ghost Boss of ${f.name}! You've earned the “${f.name} cleared” badge.`});
}
const START_GAP=3, MAX_GAP=5, CREEP_SECS=20;
function begin(cfg){play=Object.assign(cfg,{slots:null,active:null,i:0,gap:START_GAP,tries:0,hinted:false,candy:0,mistakes:0,marks:[],input:"",locked:false,qtime:0});sfx.tap();renderQ();saveRun()}
function saveRun(){if(!play)return;const last=play.i===play.qs.length-1;if(play.locked&&last)return;
  P.run={key:play.key,title:play.title,sub:play.sub,fact:play.fact,boss:play.boss,qids:play.qs.map(q=>q.id),
    i:play.locked?play.i+1:play.i,gap:play.gap,candy:play.candy,mistakes:play.mistakes,marks:play.marks.slice(0,play.locked?play.i+1:play.i)};save()}
function clearRun(){if(P.run){delete P.run;save()}}
function resumeRun(){const r=P.run;const qs=(r&&r.qids||[]).map(id=>ALLQ[id]);
  if(!r||qs.some(q=>!q)||r.i>=qs.length){clearRun();return map()}
  play={key:r.key,title:r.title,sub:r.sub,fact:r.fact,boss:r.boss,qs,i:r.i,gap:r.gap,tries:0,hinted:false,candy:r.candy,mistakes:r.mistakes,marks:r.marks||[],input:"",slots:null,active:null,locked:false,qtime:0};
  sfx.tap();renderQ()}
function trackPos(){const n=play.qs.length,step=74/n;const run=8+play.i*step+(play.marks[play.i]==="ok"?step*.6:0);
  return{run,ghost:Math.max(1,run-play.gap*6.5)}}
function gapText(){const g=play.gap;if(g<=0)return"BOO! The ghost caught you!";
  const st=g===1?"1 step":(Number.isInteger(g)?g:g.toFixed(1))+" steps";
  return g>=MAX_GAP?`The ghost is ${st} behind. You're flying!`:g<=1.5?`Run! The ghost is only ${st} behind!`:`The ghost is ${st} behind you.`}

      if(play.gap<=0){play.locked=true;clearInterval(chaseTimer);setTimeout(caught,500)}
      else{const l=$("gapLbl");if(l)l.textContent="Too slow… the ghost drifted closer! "+gapText()}}},1000);

let leaveArmed=false;
function confirmLeave(){

function showFb(kind,html){$("fb").innerHTML=`<div class="fb ${kind}">${html}</div>`}

function renderMC(q){
  if(!q._order) q._order=q.o.slice().sort(()=>Math.random()-.5);
  $("inputArea").innerHTML=`<div class="mc${q.o.every(o=>o.length<=2)?" big-opt":""}">${q._order.map(o=>`<button type="button" data-o="${esc(o)}">${fx(o)}</button>`).join("")}</div>`;
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(play.locked||b.disabled)return;
    const r=check(q,b.dataset.o);
    if(r.ok){b.classList.add("right")} else {b.classList.add("wrong");b.disabled=true}
    answer(r)});
}
function renderPad(q){
  const isFrac=q.t==="frac", noWhole=q.form==="improper"||(isFrac&&fracVal(q.a)<1);
  if(isFrac){play.slots=play.slots||{w:"",n:"",d:""};if(!play.active)play.active=noWhole?"n":"w"}
  const keys=isFrac?["7","8","9","⌫","4","5","6","next","1","2","3","clear","0"]:["7","8","9","⌫","4","5","6","clear","1","2","3",".","0"];
  const label={"⌫":"⌫","clear":"Clear","next":"Next box ➜"}, aria={"⌫":"Delete","clear":"Clear","next":"Move to the next box",".":"Decimal point"};
  const box=isFrac?`
    <div class="answer-box frac-box" id="abox">
      ${noWhole?"":`<button type="button" class="slot-btn whole" data-slot="w" aria-label="Whole number box"></button>`}
      <span class="fr-in"><button type="button" class="slot-btn" data-slot="n" aria-label="Top number box"></button><span class="fr-bar"></span><button type="button" class="slot-btn" data-slot="d" aria-label="Bottom number box"></button></span>
      ${q.u?`<span class="unit">${esc(q.u)}</span>`:""}</div>`
    :`<div class="answer-box" id="abox">${q.u==="$"?'<span class="unit">$</span>':""}<span class="val" id="val"></span>${q.u&&q.u!=="$"?`<span class="unit">${esc(q.u)}</span>`:""}</div>`;
  $("inputArea").innerHTML=box+`
    <div class="pad" role="group" aria-label="Number keypad" style="margin-top:12px">
      ${keys.map(k=>`<button type="button" class="${/^\d$/.test(k)?"":"fn"}" data-k="${k}" aria-label="${aria[k]||k}">${label[k]||k}</button>`).join("")}
      <button type="button" class="go" data-k="go" style="grid-column:span 3">Check ✓</button>
    </div>
    ${isFrac?`<p class="note" style="margin-top:8px">Tap a box, then type the number in it.${noWhole?"":" Leave the whole-number box empty if there is no whole number."}</p>`:""}`;
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>key(b.dataset.k));
  document.querySelectorAll("[data-slot]").forEach(b=>b.onclick=()=>{if(play.locked)return;play.active=b.dataset.slot;sfx.tap();setVal()});
  setVal();
}
function slotOrder(){const q=play.qs[play.i];return(q.form==="improper"||fracVal(q.a)<1)?["n","d"]:["w","n","d"]}
function setVal(){
  const q=play&&play.qs[play.i];if(!q)return;
  if(q.t==="frac"){const lab={w:"whole",n:"top",d:"bottom"};
    document.querySelectorAll("[data-slot]").forEach(b=>{const k=b.dataset.slot,v=play.slots[k];
      b.innerHTML=v?esc(v):`<small>${lab[k]}</small>`;b.classList.toggle("active",play.active===k);b.classList.toggle("filled",!!v);
      b.setAttribute("aria-pressed",play.active===k)});return}
  const v=$("val");if(v)v.innerHTML=typed(play.input)}
function fracInput(){const{w,n,d}=play.slots;if(!n&&!d)return w;return w?`${w} ${n}/${d}`:`${n}/${d}`}
function key(k){
  if(!play||play.locked)return; const q=play.qs[play.i]; if(q.t==="mc")return;
  if(q.t==="frac"){
    if(k==="go"){const{w,n,d}=play.slots;
      if(!w&&!n&&!d)return;
      if((n&&!d)||(!n&&d)){showFb("no",!d?"Fill in the bottom number too.":"Fill in the top number too.");shake();return}
      answer(check(q,fracInput()));return}
    sfx.tap();const a=play.active;
    if(k==="next"){const o=slotOrder();play.active=o[(o.indexOf(a)+1)%o.length]}
    else if(k==="⌫")play.slots[a]=play.slots[a].slice(0,-1);
    else if(k==="clear"){play.slots={w:"",n:"",d:""};play.active=slotOrder()[0]}
    else if(/^\d$/.test(k)&&play.slots[a].length<4)play.slots[a]+=k;
    setVal();return}
  if(k==="go"){if(!play.input.trim())return;answer(check(q,play.input));return}
  if(k==="next"||k==="space"||k==="/")return;
  if(k==="."&&q.t==="frac")return;
  sfx.tap();
  if(k==="⌫")play.input=play.input.slice(0,-1);
  else if(k==="clear")play.input="";
  else if(play.input.length<14)play.input+=k;
  setVal();
}
document.addEventListener("keydown",e=>{
  if(!play||!$("abox")||e.target.tagName==="INPUT")return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key===".")key(".");
  else if(e.key===" "||e.key==="/"||e.key==="Tab"){e.preventDefault();key("next")}else if(e.key==="Backspace")key("⌫");else if(e.key==="Enter")key("go");
});

function answer(r){
  const q=play.qs[play.i];
  if(r.ok){
    let c=CANDY[q.d]+(play.boss?1:0); if(play.tries>0)c=Math.ceil(c/2); if(play.hinted)c=Math.max(0,c-1);
    play.candy+=c; play.marks[play.i]="ok"; play.locked=true; sfx.right(); bats("🍬",6);
    if(play.tries===0)play.gap=Math.min(MAX_GAP,play.gap+1); updateTrackSave();
    P.missed=P.missed.filter(id=>id!==q.id); save();
    showFb("ok",`<span>${fx(r.note||"Correct!")} +${c} 🍬</span>`); next();
  } else {
    if(r.msg&&q.t!=="mc"){showFb("no",fx(r.msg));shake();return}  // format nudge: no penalty
    play.gap=Math.max(0,play.gap-1); play.tries++; play.mistakes++; sfx.wrong(); shake();
    if(!P.missed.includes(q.id)){P.missed.push(q.id);save()}
    if(play.gap<=0){play.locked=true;clearInterval(chaseTimer);setTimeout(caught,500);updateTrack();return}
    if(play.tries>=2){
      play.marks[play.i]="bad"; play.locked=true;
      const ans=q.t==="frac"||q.t==="mc"?q.a:(q.u==="$"?"$"+q.a.toFixed(2):(Number.isInteger(q.a)&&q.a>=10000?q.a.toLocaleString("en-US"):q.a)+(q.u?(q.u==="°"?"°":" "+q.u):""));
      showFb("no",`<span>Not this time. The answer is <b>${fx(ans)}</b>.</span>${q.s?`<span class="sol">${fx(q.s)}</span>`:""}<span class="note">This riddle will come back in the floor's Ghost Boss room.</span>`);
      next();
    } else {
      showFb("no","Not quite. The ghost glided closer! Try once more.");
      if(q.t!=="mc"){play.input="";if(play.slots){play.slots={w:"",n:"",d:""};play.active=slotOrder()[0]}setVal()}
    }
    updateTrackSave();
  }
}
function updateTrackSave(){updateTrack();saveRun()}
function updateTrack(){const b=$("booEl"),r=$("runEl"),l=$("gapLbl");if(!b)return;const tp=trackPos();
  r.style.left=tp.run+"%";b.style.left=(play.gap<=0?tp.run:tp.ghost)+"%";l.textContent=gapText()}
function shake(){const a=$("abox");if(a){a.classList.remove("shake");void a.offsetWidth;a.classList.add("shake")}}
function next(){
  const last=play.i===play.qs.length-1;
  $("actions").innerHTML=`<button class="btn-main" id="nextBtn" type="button">${last?"Finish room 🎃":"Next riddle →"}</button>`;
  $("nextBtn").focus();

}

function caught(){

/* ===== Save codes: carry progress to another device without an account ===== */
const SLOT_KEYS=[...Array.from({length:16},(_,i)=>String(i+1)),"boss0","boss1","boss2","boss3"];
const ITEM_IDS=()=>[...RUNNERS,...DECOR].map(x=>x.id);
const chk=t=>{let h=11;for(const c of t)h=(h*37+c.charCodeAt(0))%1296;return h.toString(36).padStart(2,"0")};
const b64e=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/-/g,"+").replace(/_/g,"/"))));
function makeCode(){
  let body=SLOT_KEYS.map(k=>{const r=P.rooms[k];return(r?r.stars*64+Math.min(63,r.candy):0).toString(36).padStart(2,"0")}).join("");
  const ids=ITEM_IDS();let mask=0;ids.forEach((id,i)=>{if(P.owned.includes(id))mask+=2**i});
  body+=mask.toString(36).padStart(5,"0")+Math.min(P.wallet,46655).toString(36).padStart(3,"0")+Math.max(0,RUNNERS.findIndex(r=>r.id===P.runner)).toString(36);
  const nm=b64e(P.name);return(body+chk(body+nm)+"."+nm).toUpperCase().replace(/\.(.*)$/,(m,x)=>"."+nm);
}
function loadCode(raw){
  const t=(raw||"").trim().replace(/\s+/g,"");const dot=t.indexOf(".");
  if(dot<0)return{ok:false,msg:"That code looks incomplete. Copy the whole code, including the part after the dot."};
  const body=t.slice(0,dot-2).toLowerCase(),c=t.slice(dot-2,dot).toLowerCase(),nm=t.slice(dot+1);
  if(body.length!==49||chk(body+nm)!==c)return{ok:false,msg:"That code doesn't work. Check you copied all of it."};
  let name;try{name=b64d(nm)}catch(e){return{ok:false,msg:"That code doesn't work. Check you copied all of it."}}
  const rooms={};SLOT_KEYS.forEach((k,i)=>{const v=parseInt(body.slice(i*2,i*2+2),36);if(v)rooms[k]={stars:Math.floor(v/64),candy:v%64}});
  const mask=parseInt(body.slice(40,45),36),ids=ITEM_IDS(),owned=ids.filter((id,i)=>Math.floor(mask/2**i)%2===1);
  if(!owned.includes("kid"))owned.unshift("kid");
  const wallet=parseInt(body.slice(45,48),36),runner=(RUNNERS[parseInt(body.slice(48,49),36)]||RUNNERS[0]).id;
  Object.assign(P,{name:name.slice(0,20),rooms,owned,wallet,runner:owned.includes(runner)?runner:"kid"});delete P.run;save();
  return{ok:true};
}
function saveCodeSheet(){
  const code=makeCode();
  sheet(`<h2 style="font-family:var(--display);font-weight:400;font-size:2.3rem;color:var(--moon)">Your save code</h2>

  $("copyCode").onclick=()=>{const done=()=>{$("copyMsg").className="msg ok";$("copyMsg").textContent="Copied! Paste it somewhere safe."};
    const sel=()=>{const r=document.createRange();r.selectNodeContents($("codeTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("copyMsg").className="msg";$("copyMsg").textContent="The code is selected. Tap Copy in the menu that appears."};
    try{navigator.clipboard.writeText(code).then(done,sel)}catch(e){sel()}};

/* ===== Haunted Shop: spend candy on decorations and runners ===== */
function roomScene(){
  return `<div class="haunt" role="img" aria-label="Your haunted room${P.owned.filter(id=>DECOR.some(d=>d.id===id)).length?" with "+DECOR.filter(d=>P.owned.includes(d.id)).map(d=>d.n.toLowerCase()).join(", "):", still empty"}">
    <div class="haunt-floor"></div>
    ${DECOR.filter(d=>P.owned.includes(d.id)).map(d=>`<span class="deco" style="left:${d.x}%;top:${d.y}%;font-size:${d.z}rem">${d.ic}</span>`).join("")}
    <span class="deco me" style="left:50%;top:70%;font-size:3rem">${runnerIc()}</span>
    ${DECOR.some(d=>P.owned.includes(d.id))?"":`<p class="haunt-empty">Your room is empty. Buy decorations to haunt it!</p>`}</div>`;
}
function shop(msg){
  play=null; clearInterval(chaseTimer);
  const card=(it,kind)=>{const own=P.owned.includes(it.id),eq=kind==="run"&&P.runner===it.id,afford=P.wallet>=it.p;
    let btn;
    if(kind==="run"&&own) btn=eq?`<button type="button" disabled>Running ✓</button>`:`<button type="button" class="btn-ghost" data-eq="${it.id}">Run as this</button>`;
    else if(own) btn=`<button type="button" disabled>In your room ✓</button>`;
    else btn=`<button type="button" class="btn-main" data-buy="${it.id}" data-kind="${kind}" ${afford?"":"disabled"}>${afford?`Buy · ${it.p} 🍬`:`Need ${it.p} 🍬`}</button>`;
    return `<div class="item${own?" own":""}"><span class="item-ic" aria-hidden="true">${it.ic}</span><span class="item-nm">${esc(it.n)}</span>${btn}</div>`};
  $("app").innerHTML=`
  <div class="bar"><span class="brand">Haunted Shop</span><div class="stats"><span class="pill">🍬 <b>${P.wallet}</b> to spend</span></div></div>
  <div class="row"><button class="btn-ghost" id="back" type="button">← Back to the manor</button></div>
  ${msg?`<p class="msg ok" role="status">${esc(msg)}</p>`:""}
  <section class="floor"><div class="floor-head"><h2>Your haunted room</h2></div>${roomScene()}</section>
  <section class="floor"><div class="floor-head"><h2>Runners</h2><span class="term">Who races the ghost</span></div>
    <div class="shop">${RUNNERS.map(r=>card(r,"run")).join("")}</div></section>
  <section class="floor"><div class="floor-head"><h2>Decorations</h2><span class="term">For your haunted room</span></div>
    <div class="shop">${DECOR.map(d=>card(d,"deco")).join("")}</div></section>
  <p class="note">Earn more candy by clearing rooms. Replaying a room earns candy to spend too, but only your best run counts for the leaderboard.</p>`;
  $("back").onclick=map;
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
    const it=(b.dataset.kind==="run"?RUNNERS:DECOR).find(x=>x.id===b.dataset.buy);
    if(!it||P.wallet<it.p||P.owned.includes(it.id))return;
    P.wallet-=it.p;P.owned.push(it.id);if(b.dataset.kind==="run")P.runner=it.id;save();sfx.win();bats(it.ic,8);
    shop(`You bought ${it.n}!${b.dataset.kind==="run"?" It will race the ghost for you.":""}`)});
  document.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{P.runner=b.dataset.eq;save();sfx.tap();shop()});
  scrollTo({top:0});
}
/* ===== leaderboard (shared db when available; score code fallback) ===== */
let DB=null,USER=null,UID=null,rows=[],canPost=null,isTeacher=false,lbStatus="Connecting to the leaderboard…";
function scoreCode(name,candy,stars){let h=7;const s=`${name.toLowerCase().trim()}|${candy}|${stars}`;for(const c of s)h=(h*31+c.charCodeAt(0))%1296;
  const al="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";return `${candy}-${stars}-${al[h%32]}${al[Math.floor(h/32)%32]}`}
async function postScore(){
  if(!DB||!UID||canPost===false) return null;
  const t=totals();
  try{await DB.collection("scores").doc(UID).set({name:P.name,candy:t.candy,stars:t.stars,rooms:t.done,updated:Date.now()});
    canPost=true;return{ok:true,text:"Score posted to the class leaderboard."}}
  catch(e){canPost=false;return null}
}
(async()=>{
  try{
    const [db,user]=await Promise.all([window.claude?.use?.("db")??null,window.claude?.use?.("user")??null]);
    DB=db;USER=user;
    if(USER){try{UID=await USER.id()}catch(e){} try{isTeacher=!!(await USER.canEdit())}catch(e){}}
    lbStatus="";
    if(!DB){isTeacher=false;return}
    DB.collection("scores").orderBy("candy","desc").limit(100).onSnapshot(s=>{
      rows=s.docs.map(d=>Object.assign({_id:d.id},d.data()));if(!$("sheet").hidden&&$("lbList"))drawBoard()},
      ()=>{lbStatus="The leaderboard can't be reached right now.";if($("lbList"))drawBoard()});
  }catch(e){lbStatus=""}
})();

function leaderboard(){
  const t=totals();
  sheet(`<h2 style="font-family:var(--display);font-weight:400;font-size:2.4rem;color:var(--moon)">Class Leaderboard</h2>
    <div id="lbList"></div>
    <div id="myCode"></div>
    ${isTeacher?`<div class="teacher"><h3>Teacher: add a score from a code</h3>
      <p class="note">Students who can't post their own score can read you their nickname and score code from this screen.</p>
      <input type="text" id="tName" placeholder="Nickname" maxlength="20" autocomplete="off">
      <input type="text" id="tCode" placeholder="Score code, e.g. 42-11-QX" maxlength="16" autocomplete="off">
      <div class="row"><button class="btn-main" id="tAdd" type="button">Add to leaderboard</button></div><p class="msg" id="tMsg"></p></div>`:""}
    <div class="row"><button class="btn-ghost" id="lbClose" type="button">Close</button></div>`);
  drawBoard();
  const mine=rows.find(r=>r._id===UID);
  if(DB&&UID&&t.done&&(!mine||mine.candy!==t.candy||mine.stars!==t.stars)) postScore().then(drawBoard);
  $("lbClose").onclick=closeSheet;
  if(isTeacher) $("tAdd").onclick=teacherAdd;
}
function drawBoard(){
  const el=$("lbList");if(!el)return; const t=totals();
  if(!DB){el.innerHTML=`<p class="note">The shared leaderboard isn't available on this device, so your score stays here. Show your teacher your score code below.</p>`}
  else if(lbStatus){el.innerHTML=`<p class="note">${esc(lbStatus)}</p>`}
  else if(!rows.length){el.innerHTML=`<p class="note">No scores yet. Clear a room to be the first name on the board!</p>`}
  else el.innerHTML=`<ol class="board">${rows.map((r,i)=>`<li class="${r._id===UID?"me":""}"><span>${i+1}</span><span class="nm">${esc(r.name||"Mystery ghost")}</span><span>🏆 ${r.candy|0}</span><span>⭐ ${r.stars|0}${isTeacher?` <button class="x" type="button" data-del="${esc(r._id)}" aria-label="Remove ${esc(r.name||"entry")}">✕</button>`:""}</span></li>`).join("")}</ol>`;
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(b.dataset.armed){try{await DB.collection("scores").doc(b.dataset.del).delete()}catch(e){}}
    else{b.dataset.armed=1;b.textContent="Remove?"}});
  const mc=$("myCode");
  if(mc){const posted=canPost===true&&rows.some(r=>r._id===UID);
    mc.innerHTML=posted?`<p class="note">Your score posts automatically each time you clear a room.</p>`:
      t.done?`<p class="note">Your score code (for ${esc(P.name)}). Show it to your teacher:</p><div class="code">${scoreCode(P.name,t.candy,t.stars)}</div>`:
      `<p class="note">Clear your first room to get on the board.</p>`}
}
async function teacherAdd(){
  const name=$("tName").value.trim(), code=$("tCode").value.trim().toUpperCase().replace(/\s/g,""), m=$("tMsg");
  const mm=code.match(/^(\d+)-(\d+)-([A-Z0-9]{2})$/);
  if(!DB){m.className="msg err";m.textContent="The leaderboard isn't connected right now.";return}
  if(!name||!mm){m.className="msg err";m.textContent="Enter the nickname and a code like 42-11-QX.";return}
  if(scoreCode(name,+mm[1],+mm[2])!==code){m.className="msg err";m.textContent="That code doesn't match this nickname. Check the spelling of both.";return}
  try{const id="t_"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,30);
    await DB.collection("scores").doc(id).set({name,candy:+mm[1],stars:+mm[2],updated:Date.now(),byTeacher:true});
    m.className="msg ok";m.textContent=`Added ${name}.`;$("tName").value="";$("tCode").value=""}
  catch(e){m.className="msg err";m.textContent="Couldn't save that score. Try again in a moment."}
}


P.name?map():welcome();
